<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta http-equiv="Content-Security-Policy" content="{{csp}}">
<title>{{title}}</title>
<link rel="icon" href="{{favicon}}">
<style>{{theme}}</style>
<style>
* { box-sizing: border-box; }
/* The older token names, for the pages not rebuilt on the shared components yet (lib/theme.mjs has the tokens). */
:root { --card: var(--surface); --ink: var(--text); --run: var(--accent); --run-bg: var(--accent-bg); --on-run: var(--on-accent); --pass: var(--ok); --pass-bg: var(--ok-bg); --fail: var(--bad); --fail-bg: var(--bad-bg); --wait: var(--ask); --wait-bg: var(--ask-bg); --none-bg: var(--line2); --bar: var(--accent); --bar-hot: var(--bad); --note: var(--retry); --note-bg: var(--retry-bg); --ev: var(--accent); }
.retry { margin: 0; min-height: 0; padding: 2px 10px; font-size: 12px; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); }
.wrap { max-width: 1440px; margin: 0 auto; padding: 20px 24px 40px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
a { color: var(--accent); }
/* The shell: top bar (breadcrumb; status, Export PDF, theme switch) and the tab row. */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--line); }

.top .crumbs a:hover { text-decoration: underline; }

.top .crumbs .here { font-family: var(--mono); font-weight: 600; color: var(--text); overflow-wrap: anywhere; }
.mark { flex: none; color: var(--text); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.themes { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; padding: 0; margin: 0; background: var(--surface2); }
.themes input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.themes label { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text2); }
.themes input:checked + label { background: var(--text); color: var(--bg); }
.themes input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
.tabs { display: flex; gap: 4px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.tabs a { flex: 0 0 auto; padding: 12px 12px 10px; font-size: 13px; font-weight: 600; color: var(--text2); text-decoration: none; border-bottom: 2px solid transparent; }
.tabs a:hover { color: var(--text); }
.tabs a[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); }
.live { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live { padding: 2px 10px 2px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); }
.live[data-state="live"]::before { background: var(--pass); animation: pulse 2s ease-in-out infinite; }
.live[data-state="reconnecting"]::before, .live[data-state="connecting"]::before { background: var(--wait); animation: pulse 1.2s ease-in-out infinite; }
.live[data-state="disconnected"]::before { background: var(--fail); }
.live[data-state="finished"]::before { background: var(--ink); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: 1px; flex: none; background: var(--muted); }
.dot-working { background: var(--pass); animation: pulse 2s ease-in-out infinite; }
.dot-retrying { background: var(--note); }
.dot-queued { background: var(--run); }
.dot-blocked { background: transparent; box-shadow: inset 0 0 0 2px var(--muted); }
.dot-needs-you { background: var(--wait); box-shadow: 0 0 0 2px var(--card), 0 0 0 3.5px var(--wait); margin: 0 4px; }
.dot-stale { background: var(--fail); }
.dot-passed { background: var(--ink); }
.dot-stopped { background: color-mix(in oklab, var(--muted) 70%, var(--card)); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .live::before, .dot { animation: none !important; } }
.card.fin { background: color-mix(in oklab, var(--card) 55%, var(--bg)); }
.card.fin > *, .timeline li.fin { opacity: .78; }
:root:has(#show-finished:not(:checked)) .card.fin, :root:has(#show-finished:not(:checked)) .timeline li.fin { display: none; }
body[data-sort="oldest"] .timeline { display: flex; flex-direction: column-reverse; }
.legend .fchip { margin-right: 8px; }
header.run { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; margin-top: 16px; }
h1 { font-size: 22px; margin: 0; overflow-wrap: anywhere; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; }
.back { display: inline-block; margin-top: 14px; font-size: 14px; }
.meta { color: var(--muted); font-size: 13px; }
.status { margin-top: 14px; padding: 12px 14px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--run); overflow-wrap: anywhere; }

.s-finishing { background: var(--note-bg); color: var(--note); }
.bar.small { height: 6px; }
.situation { margin-top: 16px; font-size: 18px; line-height: 1.4; overflow-wrap: anywhere; }
.situation p { margin: 0; }
.situation .meta { margin-top: 4px; }
.goal { margin-top: 14px; padding: 12px 14px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--wait); overflow-wrap: anywhere; }
.goal.met { border-left-color: var(--pass); }
.goal h3 { margin: 0; font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.goal > p { margin: 6px 0 0; }
.needs { margin-top: 14px; padding: 12px 14px; border-radius: var(--radius); background: var(--wait-bg); border: 1px solid var(--wait); overflow-wrap: anywhere; }
.needs > b { color: var(--wait); }
.needs ul { margin: 6px 0 0; padding-left: 18px; }
.needs li { margin: 6px 0; }
.needs .rec { color: var(--muted); font-size: 13px; }
.needs.calm { background: transparent; border-color: var(--line); color: var(--muted); }
.eta { margin-top: 10px; font-size: 14px; color: var(--muted); }
.eta b { color: var(--ink); margin-right: 6px; }
.next { margin-top: 14px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--run); border-radius: var(--radius); }
.next b { margin-right: 6px; }
details { margin-top: 10px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--toggle-pad) 14px; }
summary { cursor: pointer; font-weight: 600; }
dl { margin: 8px 0 0; } dt { font-weight: 600; margin-top: 8px; } dd { margin: 2px 0 0; color: var(--muted); overflow-wrap: anywhere; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); color: var(--text2); background: var(--surface); white-space: nowrap; }
.s-pass, .s-passed, .s-done, .s-met { background: var(--pass-bg); color: var(--pass); }
.s-fail, .s-stopped, .s-stop { background: var(--fail-bg); color: var(--fail); }
.s-building, .s-judging, .s-working, .s-continue, .s-integrate, .s-queued { background: var(--run-bg); color: var(--run); }
.s-blocked { background: transparent; color: var(--muted); border: 1px dashed var(--muted); }
.s-needs-you { background: var(--wait); color: var(--card); }
.chip a.ulink { color: inherit; text-decoration: underline; }
.deps { list-style: none; margin: 4px 0 0; padding: 0; } .deps li { margin: 6px 0; }
.legend .key { white-space: nowrap; }
.s-split, .s-done-with-gaps, .s-partial, .s-not-yet { background: var(--wait-bg); color: var(--wait); }
.badge { --k: var(--muted); display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
  background: color-mix(in oklab, var(--k) 15%, var(--card)); color: color-mix(in oklab, var(--k) 72%, var(--ink)); border: 1px solid color-mix(in oklab, var(--k) 40%, var(--card)); }
.k-decision { --k: #2563eb; } .k-question { --k: #b45309; } .k-answer { --k: #0d9488; } .k-note { --k: #7c3aed; }
.k-pass { --k: var(--pass); } .k-fail { --k: var(--fail); } .k-stop { --k: #be123c; } .k-merge { --k: #9333ea; }
.k-evidence { --k: #0891b2; } .k-strategy { --k: #ca8a04; } .k-behaviour { --k: #db2777; } .k-build { --k: #64748b; } .k-link { --k: #4f46e5; } .k-info { --k: #737373; }
.grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.grid, .lists { align-items: start; } /* issue #23: a card no taller than its content, so a short neighbour of a growing card is never what the browser anchors to */
/* Issue #23: a list that grows live sits in its own anchor container. Its tail, a box just under the list whose height
   the container gives back (so nothing moves), covers the padding and border its toggle and card leave below the list. With the top of the screen there,
   the browser's scroll anchoring holds on to the tail, which moves with the list, not to a parent whose top stays put. */
:root { --card-pad: 14px; --toggle-pad: 10px; --list-tail: calc(var(--card-pad) + var(--toggle-pad)); } /* the tail is the card's and the toggle's padding: change one and it follows */
.list-anchor { margin-bottom: calc(-1 * var(--list-tail)); }
.list-anchor::after { content: ""; display: block; height: var(--list-tail); pointer-events: none; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--card-pad); min-width: 0; }
.card h3 { margin: 0; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; align-items: center; overflow-wrap: anywhere; }
.card h3 a.open { font-weight: 600; font-size: 13px; white-space: nowrap; }
.row { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.cause { font-size: 12px; color: var(--muted); }
.say { margin: 10px 0 0; font-size: 14px; overflow-wrap: anywhere; }
.flag { background: var(--note-bg); color: var(--note); }
.legend { margin: -4px 0 10px; font-size: 12px; color: var(--muted); }
.links { font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; }
.links > span { min-width: 0; overflow-wrap: anywhere; }
details.raw { margin-top: 10px; padding: 6px 10px; font-size: 13px; }
details.raw summary { font-weight: 400; color: var(--muted); }
.unit-next { margin-top: 8px; font-size: 13px; }
.bar { height: 8px; background: var(--none-bg); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--bar); }
.bar i.hot { background: var(--bar-hot); }
.bar i.calm { background: color-mix(in oklab, var(--muted) 55%, var(--card)); }
.spark-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
svg.spark circle:focus-visible { outline: none; stroke: var(--run); stroke-width: 2; }
.score-one { margin: 8px 0 0; }
.budget { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
.budget .card { padding: 10px 14px; font-size: 13px; }
svg.spark { display: block; }
svg.spark polyline { fill: none; stroke: var(--muted); stroke-width: 1.5; }
svg.spark .p { fill: var(--pass); } svg.spark .f { fill: var(--fail); }
svg.spark line { stroke: var(--line); stroke-dasharray: 2 3; }
.behaviours, .evlist { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13px; display: grid; gap: 6px; }
.behaviours li { overflow-wrap: anywhere; }
.bev { color: var(--muted); margin: 2px 0 0 4px; }
.evidence { border-top: 1px solid var(--line); padding-top: 6px; overflow-wrap: anywhere; }
pre { font: 12px/1.45 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: calc(var(--radius) * .6); padding: 8px 10px; margin: 6px 0 0; overflow: auto; max-height: 420px; white-space: pre-wrap; overflow-wrap: anywhere; }
img.thumb { display: block; max-width: min(100%, 320px); max-height: 200px; margin-top: 6px; border: 1px solid var(--line); border-radius: calc(var(--radius) * .6); object-fit: cover; object-position: top; }
.lists { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.lists ul, .timeline { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
.lists li, .timeline li { margin: 4px 0; overflow-wrap: anywhere; }
.empty { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.timeline { list-style: none; padding: 0; }
.timeline li { display: grid; grid-template-columns: 150px 112px 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); margin: 0; }
.timeline li[hidden] { display: none; }
.timeline time { color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; font-size: 13px; color: var(--muted); }
.tl-tools .grow { flex: 1 1 220px; }
.tl-tools fieldset { display: flex; flex-wrap: wrap; gap: 6px; border: 0; padding: 0; margin: 0; flex-basis: 100%; }
.tl-tools legend { padding: 0; margin-bottom: 4px; }
.tl-tools select, .tl-tools input[type=search] { display: block; margin-top: 4px; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--radius) * .6); padding: 6px 8px; width: 100%; }
mark.hl { background: color-mix(in oklab, var(--wait) 32%, var(--card)); color: var(--ink); border-radius: 3px; padding: 0 1px; box-shadow: 0 0 0 1px color-mix(in oklab, var(--wait) 55%, var(--card)); }
.fchip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.fchip span { display: inline-block; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; color: var(--ink); background: var(--card); }
.fchip input:checked + span { background: var(--run-bg); border-color: var(--run); color: var(--run); font-weight: 600; }
.fchip input:focus-visible + span { outline: 2px solid var(--run); outline-offset: 1px; }
.answered { opacity: .82; padding-left: 18px; }
.answered li { margin: 8px 0; }
.round { border-top: 1px solid var(--line); padding: 10px 0; }
.round h4 { margin: 0; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.needs ul:has(> .q) { padding-left: 0; }
.q { margin: 12px 0; list-style: none; }
.qtext { margin: 0; }
.qlabel { margin: 0 0 2px; font-size: 13px; font-weight: 600; color: var(--muted); overflow-wrap: anywhere; }
.rec, .ans, .from { margin: 4px 0 0; font-size: 14px; }
.from { font-size: 13px; overflow-wrap: anywhere; }
.hint { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.opts { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
.opts .picked::marker { content: "✓ "; color: var(--pass); }
fieldset { border: 0; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
legend { font-size: 13px; color: var(--muted); padding: 0; margin-bottom: 4px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: calc(var(--radius) * .8); cursor: pointer; }
.opt:has(input:checked) { border-color: var(--run); box-shadow: inset 0 0 0 1px var(--run); }
.opt > input { margin-top: 3px; flex: none; }
.opt > span { display: grid; gap: 2px; min-width: 0; flex: 1; overflow-wrap: anywhere; }
.opt small { color: var(--muted); font-size: 13px; }
input[type=text], textarea { width: 100%; margin-top: 4px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: calc(var(--radius) * .6); padding: 6px 8px; }
textarea { display: block; resize: vertical; }
button { margin-top: 8px; font: inherit; font-weight: 600; color: var(--on-run); background: var(--run); border: 0; border-radius: calc(var(--radius) * .6); padding: 7px 16px; cursor: pointer; min-height: 36px; }
:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; }
form.note { margin-top: 12px; font-size: 14px; }
form.note label { display: block; color: var(--muted); }
.toc { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px; font-size: 13px; }
.stat span { display: block; font-size: 12px; color: var(--muted); }
.stat b { display: block; font-size: 20px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat b .cause { font-weight: 400; }
h3.sub { font-size: 14px; margin: 18px 0 6px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
th, td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }
thead th { border-top: 0; color: var(--muted); font-weight: 600; font-size: 12px; }
tbody th { font-weight: 600; overflow-wrap: anywhere; min-width: 140px; }
td .bar { max-width: 120px; }
code { font: 12px var(--mono); background: var(--none-bg); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
ul.plain { list-style: none; padding: 0; margin: 6px 0 0; font-size: 14px; display: grid; gap: 10px; }
ul.plain li { overflow-wrap: anywhere; }
ul.run-rows { grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: var(--gap); }
.run-row p { margin: 6px 0 0; } .run-row .bar { margin-top: 8px; }
ul.plain .cause { margin-top: 2px; }
section.self .card ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
section.self .card li { margin: 4px 0; overflow-wrap: anywhere; }
section.self .card ul.plain { padding-left: 0; } .gaps .card { min-width: 0; } .gaps code { font-size: 11px; }
/* The Gaps filter bar: its own row, ruled off from the panels, with room for the focus ring. */
.gap-tools { margin: 14px 0 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line); gap: 10px 12px; }
.gap-tools label { flex: 1 1 150px; min-width: 0; }
.gap-tools label.grow { flex: 3 1 280px; }
.gap-tools select, .gap-tools input[type=search] { height: 36px; margin-top: 6px; }
.gap-tools .gap-count { flex-basis: 100%; margin: 0; }
header.run a.open { margin-left: auto; font-size: 14px; font-weight: 600; }
.map-scroll:focus-visible { outline: 3px solid var(--run); outline-offset: 2px; }
.map-scroll { overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-top: 8px; }
.map-scroll.mind { max-height: 80vh; }
svg.map { display: block; max-width: none; margin: 0 auto; font: 13px var(--font); }
.map-hint { display: none; margin: 8px 0 0; font-size: 12px; color: var(--muted); }
.map-hint.wide { display: block; }
@media (max-width: 640px) { .map-hint { display: block; } }
svg.map text { fill: var(--ink); }
svg.map .b { font-weight: 700; } svg.map .sm { font-size: 12px; } svg.map .xs { font-size: 10.5px; }
svg.map .muted { fill: var(--muted); } svg.map .h { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; fill: var(--muted); } svg.map .warn { fill: var(--wait); }
svg.map .edge, svg.lsw .edge { fill: none; stroke: color-mix(in oklab, var(--muted) 45%, var(--card)); stroke-width: 1.4; }
svg.map .edge.after, svg.lsw .edge.after { stroke: var(--muted); stroke-width: 2; }
svg.map .edge.crit, svg.lsw .edge.crit { stroke: var(--run); stroke-width: 3.5; }
svg.map .edge.follow-up, svg.map .edge.inferred, svg.lsw .edge.follow-up, svg.lsw .edge.inferred { stroke-dasharray: 4 4; }
svg.map .edge.follow-up, svg.lsw .edge.follow-up { stroke: color-mix(in oklab, var(--note) 70%, var(--card)); }
svg.map .edge.named, svg.lsw .edge.named { stroke: var(--pass); stroke-width: 2; }
svg.map .elabel { paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }

svg.map .arrow, svg.lsw .arrow { fill: var(--muted); } svg.map .arrow.crit, svg.lsw .arrow.crit { fill: var(--run); }
svg.map .arrow.link, svg.lsw .arrow.link { fill: var(--card); stroke: var(--muted); stroke-width: 1.6; }
svg.map .arrow.fu, svg.lsw .arrow.fu { fill: none; stroke: var(--note); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
svg.lsw { flex: none; overflow: visible; }

svg.map .eg { outline: none; } svg.map .eg * { pointer-events: none; }
