<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="{{csp}}">
<title>{{title}}</title>
<link rel="icon" href="{{favicon}}">
<style>{{theme}}</style>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 14px 16px 40px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
a { color: var(--run); }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 6px; color: var(--ink); font-size: 14px; }
.brand span { color: var(--muted); font-size: 13px; }
.brand a { color: inherit; }
.mark { flex: none; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.themes { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; margin: 0; background: var(--card); }
.themes input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.themes label { padding: 3px 10px; border-radius: 999px; font-size: 12px; cursor: pointer; color: var(--muted); }
.themes input:checked + label { background: var(--none-bg); color: var(--ink); font-weight: 600; }
.themes input:focus-visible + label { outline: 2px solid var(--run); outline-offset: 1px; }
.live { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live[data-state="live"]::before { background: var(--pass); }
.live[data-state="reconnecting"]::before { background: var(--wait); }
header.run { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; margin-top: 16px; }
h1 { font-size: 22px; margin: 0; overflow-wrap: anywhere; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; }
.back { display: inline-block; margin-top: 14px; font-size: 14px; }
.meta { color: var(--muted); font-size: 13px; }
.situation { margin-top: 16px; font-size: 18px; line-height: 1.4; overflow-wrap: anywhere; }
.situation p { margin: 0; }
.situation .meta { margin-top: 4px; }
.goal { margin-top: 14px; padding: 12px 14px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--wait); overflow-wrap: anywhere; }
.goal.met { border-left-color: var(--pass); }
.goal h3 { margin: 0; font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.goal > p { margin: 6px 0 0; }
.needs { margin-top: 14px; padding: 12px 14px; border-radius: var(--radius); background: var(--wait-bg); border: 1px solid var(--wait); overflow-wrap: anywhere; }
.needs > b { color: var(--wait); }
.needs ul { margin: 6px 0 0; padding-left: 18px; }
.needs li { margin: 6px 0; }
.needs .rec { color: var(--muted); font-size: 13px; }
.needs.calm { background: transparent; border-color: var(--line); color: var(--muted); }
.eta { margin-top: 10px; font-size: 14px; color: var(--muted); }
.eta b { color: var(--ink); margin-right: 6px; }
.next { margin-top: 14px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--run); border-radius: var(--radius); }
.next b { margin-right: 6px; }
details { margin-top: 10px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; }
summary { cursor: pointer; font-weight: 600; }
dl { margin: 8px 0 0; } dt { font-weight: 600; margin-top: 8px; } dd { margin: 2px 0 0; color: var(--muted); overflow-wrap: anywhere; }
.chip { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--none-bg); color: var(--ink); white-space: nowrap; }
.s-pass, .s-done, .s-met { background: var(--pass-bg); color: var(--pass); }
.s-fail, .s-stopped, .s-stop { background: var(--fail-bg); color: var(--fail); }
.s-building, .s-continue, .s-integrate { background: var(--run-bg); color: var(--run); }
.s-judging, .s-split, .s-done-with-gaps, .s-partial, .s-not-yet { background: var(--wait-bg); color: var(--wait); }
.badge { --k: var(--muted); display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
  background: color-mix(in oklab, var(--k) 15%, var(--card)); color: color-mix(in oklab, var(--k) 72%, var(--ink)); border: 1px solid color-mix(in oklab, var(--k) 40%, var(--card)); }
.k-decision { --k: #2563eb; } .k-question { --k: #b45309; } .k-answer { --k: #0d9488; } .k-note { --k: #7c3aed; }
.k-pass { --k: var(--pass); } .k-fail { --k: var(--fail); } .k-stop { --k: #be123c; } .k-merge { --k: #9333ea; }
.k-evidence { --k: #0891b2; } .k-strategy { --k: #ca8a04; } .k-behaviour { --k: #db2777; } .k-build { --k: #64748b; } .k-link { --k: #4f46e5; } .k-info { --k: #737373; }
.grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; }
.card h3 { margin: 0; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; align-items: center; overflow-wrap: anywhere; }
.card h3 a.open { font-weight: 600; font-size: 13px; white-space: nowrap; }
.row { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.cause { font-size: 12px; color: var(--muted); }
.say { margin: 10px 0 0; font-size: 14px; overflow-wrap: anywhere; }
.flag { background: var(--wait-bg); color: var(--wait); }
.legend { margin: -4px 0 10px; font-size: 12px; color: var(--muted); }
.links { font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; }
details.raw { margin-top: 10px; padding: 6px 10px; font-size: 13px; }
details.raw summary { font-weight: 400; color: var(--muted); }
.unit-next { margin-top: 8px; font-size: 13px; }
.bar { height: 8px; background: var(--none-bg); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--bar); }
.bar i.hot { background: var(--bar-hot); }
.budget { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
.budget .card { padding: 10px 14px; font-size: 13px; }
svg.spark { display: block; }
svg.spark polyline { fill: none; stroke: var(--muted); stroke-width: 1.5; }
svg.spark .p { fill: var(--pass); } svg.spark .f { fill: var(--fail); }
svg.spark line { stroke: var(--line); stroke-dasharray: 2 3; }
.behaviours, .evlist { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13px; display: grid; gap: 6px; }
.behaviours li { overflow-wrap: anywhere; }
.bev { color: var(--muted); margin: 2px 0 0 4px; }
.evidence { border-top: 1px solid var(--line); padding-top: 6px; overflow-wrap: anywhere; }
pre { font: 12px/1.45 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: calc(var(--radius) * .6); padding: 8px 10px; margin: 6px 0 0; overflow: auto; max-height: 420px; white-space: pre-wrap; overflow-wrap: anywhere; }
img.thumb { display: block; max-width: min(100%, 320px); max-height: 200px; margin-top: 6px; border: 1px solid var(--line); border-radius: calc(var(--radius) * .6); object-fit: cover; object-position: top; }
.lists { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.lists ul, .timeline { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
.lists li, .timeline li { margin: 4px 0; overflow-wrap: anywhere; }
.empty { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.timeline { list-style: none; padding: 0; }
.timeline li { display: grid; grid-template-columns: 150px 112px 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); margin: 0; }
.timeline li[hidden] { display: none; }
.timeline time { color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; font-size: 13px; color: var(--muted); }
.tl-tools .grow { flex: 1 1 220px; }
.tl-tools fieldset { display: flex; flex-wrap: wrap; gap: 6px; border: 0; padding: 0; margin: 0; flex-basis: 100%; }
.tl-tools legend { padding: 0; margin-bottom: 4px; }
.tl-tools select, .tl-tools input[type=search] { display: block; margin-top: 4px; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--radius) * .6); padding: 6px 8px; width: 100%; }
.fchip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.fchip span { display: inline-block; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; color: var(--ink); background: var(--card); }
.fchip input:checked + span { background: var(--run-bg); border-color: var(--run); color: var(--run); font-weight: 600; }
.fchip input:focus-visible + span { outline: 2px solid var(--run); outline-offset: 1px; }
.round { border-top: 1px solid var(--line); padding: 10px 0; }
.round h4 { margin: 0; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.needs ul:has(> .q) { padding-left: 0; }
.q { margin: 12px 0; list-style: none; }
.qtext { margin: 0; }
.rec, .ans, .from { margin: 4px 0 0; font-size: 14px; }
.from { font-size: 13px; overflow-wrap: anywhere; }
.hint { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.opts { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
.opts .picked::marker { content: "✓ "; color: var(--pass); }
fieldset { border: 0; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
legend { font-size: 13px; color: var(--muted); padding: 0; margin-bottom: 4px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: calc(var(--radius) * .8); cursor: pointer; }
.opt:has(input:checked) { border-color: var(--run); box-shadow: inset 0 0 0 1px var(--run); }
.opt > input { margin-top: 3px; flex: none; }
.opt > span { display: grid; gap: 2px; min-width: 0; flex: 1; overflow-wrap: anywhere; }
.opt small { color: var(--muted); font-size: 13px; }
input[type=text], textarea { width: 100%; margin-top: 4px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: calc(var(--radius) * .6); padding: 6px 8px; }
textarea { display: block; resize: vertical; }
button { margin-top: 8px; font: inherit; font-weight: 600; color: var(--on-run); background: var(--run); border: 0; border-radius: calc(var(--radius) * .6); padding: 7px 16px; cursor: pointer; min-height: 36px; }
:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; }
form.note { margin-top: 12px; font-size: 14px; }
form.note label { display: block; color: var(--muted); }
footer { margin-top: 36px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
footer a { color: inherit; }
@media (max-width: 520px) {
  .timeline li { grid-template-columns: auto 1fr; }
  .timeline li > :last-child { grid-column: 1 / -1; }
}
</style>
</head>
<body{{attrs}}>
<div class="wrap">
{{top}}
<main id="app">{{body}}</main>
{{footer}}
</div>
{{script}}
</body>
</html>
