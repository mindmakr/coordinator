<style>
* { box-sizing: border-box; }

body[data-sort="oldest"] .timeline { display: flex; flex-direction: column-reverse; }
.legend .fchip { margin-right: 8px; }

.s-pass, .s-done, .s-met { background: var(--pass-bg); color: var(--pass); }

  background: color-mix(in oklab, var(--k) 15%, var(--card)); color: color-mix(in oklab, var(--k) 72%, var(--ink)); border: 1px solid color-mix(in oklab, var(--k) 40%, var(--card)); }

.row { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.cause { font-size: 12px; color: var(--muted); }
.say { margin: 10px 0 0; font-size: 14px; overflow-wrap: anywhere; }
.flag { background: var(--wait-bg); color: var(--wait); }
.legend { margin: -4px 0 10px; font-size: 12px; color: var(--muted); }
.links { font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; }
.links > span { min-width: 0; overflow-wrap: anywhere; }
details.raw { margin-top: 10px; padding: 6px 10px; font-size: 13px; }
details.raw summary { font-weight: 400; color: var(--muted); }
.unit-next { margin-top: 8px; font-size: 13px; }
.bar { height: 8px; background: var(--none-bg); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--bar); }
.bar i.hot { background: var(--bar-hot); }

svg.spark circle:focus-visible { outline: none; stroke: var(--run); stroke-width: 2; }
.score-one { margin: 8px 0 0; }

svg.spark { display: block; }

.bev { color: var(--muted); margin: 2px 0 0 4px; }
.evidence { border-top: 1px solid var(--line); padding-top: 6px; overflow-wrap: anywhere; }

.tl-tools .grow { flex: 1 1 220px; }

.tl-tools legend { padding: 0; margin-bottom: 4px; }
.tl-tools select, .tl-tools input[type=search] { display: block; margin-top: 4px; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--radius) * .6); padding: 6px 8px; width: 100%; }
mark.hl { background: color-mix(in oklab, var(--wait) 32%, var(--card)); color: var(--ink); border-radius: 3px; padding: 0 1px; box-shadow: 0 0 0 1px color-mix(in oklab, var(--wait) 55%, var(--card)); }
.fchip input { position: absolute; opacity: 0; width: 1px; height: 1px; }

.fchip input:focus-visible + span { outline: 2px solid var(--run); outline-offset: 1px; }
.answered { opacity: .82; padding-left: 18px; }
.answered li { margin: 8px 0; }
.round { border-top: 1px solid var(--line); padding: 10px 0; }

.needs ul:has(> .q) { padding-left: 0; }

.qtext { margin: 0; }
.rec, .ans, .from { margin: 4px 0 0; font-size: 14px; }

.hint { margin: 8px 0 0; font-size: 13px; color: var(--muted); }

fieldset { border: 0; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
legend { font-size: 13px; color: var(--muted); padding: 0; margin-bottom: 4px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: calc(var(--radius) * .8); cursor: pointer; }

textarea { display: block; resize: vertical; }
button { margin-top: 8px; font: inherit; font-weight: 600; color: var(--on-run); background: var(--run); border: 0; border-radius: calc(var(--radius) * .6); padding: 7px 16px; cursor: pointer; min-height: 36px; }
:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; }

.pages { display: flex; flex-wrap: wrap; gap: 4px; margin-right: auto; font-size: 13px; }
.pages a { padding: 3px 10px; border-radius: 999px; color: var(--muted); text-decoration: none; border: 1px solid transparent; overflow-wrap: anywhere; }

.stat span { display: block; font-size: 12px; color: var(--muted); }

.scroll { overflow-x: auto; }

th, td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }

section.self .card ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
section.self .card li { margin: 4px 0; overflow-wrap: anywhere; }
header.run a.open { margin-left: auto; font-size: 14px; font-weight: 600; }
.map-scroll:focus-visible { outline: 3px solid var(--run); outline-offset: 2px; }

svg.map { display: block; max-width: none; margin: 0 auto; font: 13px var(--font); }

svg.map .b { font-weight: 700; } svg.map .sm { font-size: 12px; } svg.map .xs { font-size: 10.5px; }

.st-passed, .st-pass, .st-met { --c: var(--pass); --cb: var(--pass-bg); }
.st-fail, .st-stale { --c: var(--fail); --cb: var(--fail-bg); }

.tip { visibility: hidden; transition: visibility 0s linear .35s; position: fixed; z-index: 20; right: 16px; bottom: 16px; width: min(340px, calc(100vw - 32px)); max-height: 60vh; overflow: auto;
  padding: 10px 12px; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius);

.tip p { margin: 0 0 6px; } .tip-t { color: var(--muted); }
.tip-mark { display: inline-block; min-width: 1.4em; text-align: center; border-radius: 4px; background: var(--cb, var(--none-bg)); color: var(--c, var(--ink)); }
.tip dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
.tip dt { color: var(--muted); font-weight: 400; margin: 0; } .tip dd { margin: 0; color: var(--ink); }
.tip-open { display: inline-block; margin-top: 8px; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { svg.map .hl, .graph .n { transition: none; } }
.map-say { margin: 8px 0 0; font-size: 14px; overflow-wrap: anywhere; }
.map-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 8px 0 0; font-size: 12px; color: var(--muted); }
.map-legend span { display: inline-flex; align-items: center; gap: 5px; }
:where(.sw) { display: inline-block; width: 14px; height: 10px; border-radius: 3px; border: 1.5px solid var(--c, var(--muted)); background: var(--cb, var(--card)); }
.sw.ev { --c: var(--ev); --cb: color-mix(in oklab, var(--ev) 30%, var(--card)); border-radius: 50%; width: 10px; }
.sw[class*="h-"] { border: 0; height: 12px; }
.sw.ln-after, .sw.ln-crit, .sw.ln-link, .sw.ln-fu, .sw.ln-named, .sw.ln-inferred { height: 0; border: 0; border-top: 2px solid var(--muted); border-radius: 0; width: 18px; background: none; }
.sw.ln-crit { border-top: 3.5px solid var(--run); } .sw.ln-link { border-top-color: color-mix(in oklab, var(--muted) 45%, var(--card)); }
.sw.ln-fu, .sw.ln-inferred { border-top-style: dashed; } .sw.ln-named { border-top-color: var(--pass); }
.sw.ref.cross { border: 1.5px dashed var(--note); border-radius: 6px; background: var(--bg); }
.sw.off { border: 2px dashed var(--wait); background: var(--card); }
.map-legend.counts b { color: var(--ink); font-variant-numeric: tabular-nums; }
.nav-tools { display: flex; flex-wrap: wrap; align-items: end; gap: 6px 14px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.nav-find input { display: block; margin-top: 4px; width: min(240px, calc(100vw - 48px)); font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--radius) * .6); padding: 6px 8px; }
.nav-focus { display: inline-flex; align-items: center; gap: 6px; padding-bottom: 6px; cursor: pointer; }
/* The selection panel floats over the page, so selecting never moves the map under the pointer. */
.nav-panel { position: fixed; z-index: 25; left: 16px; bottom: 16px; width: min(380px, calc(100vw - 32px)); max-height: 45vh; overflow: auto; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--run); border-radius: var(--radius); padding: 10px 12px; color: var(--ink); overflow-wrap: anywhere; box-shadow: 0 6px 24px color-mix(in oklab, var(--ink) 18%, transparent); }
.nav-tools [data-nav-count] { flex-basis: 100%; min-height: 1.4em; }
/* While something is selected the stats panel stays out of the way (unless focus is in it). */
body:has(svg.map[data-sel]) .tip:not(:focus-within) { visibility: hidden !important; transition: none; }
svg.map .edge.copy { pointer-events: none; }
.nav-panel p { margin: 0 0 6px; }
.crumbs ol { display: flex; flex-wrap: wrap; gap: 2px 4px; list-style: none; margin: 0 0 6px; padding: 0; font-size: 12px; }
.crumbs li + li::before { content: "›"; color: var(--muted); margin-right: 4px; }
.crumbs button, .kids button, .nav-acts button { margin: 0; min-height: 30px; padding: 3px 10px; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--none-bg); border: 1px solid var(--line); }
.crumbs button { min-height: 0; padding: 1px 6px; font-weight: 400; background: none; border-color: transparent; color: var(--run); }
.crumbs [aria-current] button { color: var(--ink); font-weight: 600; }
.nav-acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
.nav-acts a.cta { display: inline-block; padding: 5px 14px; border-radius: calc(var(--radius) * .6); background: var(--run); color: var(--on-run); font-weight: 600; text-decoration: none; }
.kids { display: flex; flex-wrap: wrap; gap: 4px; list-style: none; margin: 4px 0 0; padding: 0; }
.kids [aria-selected="true"] button { border-color: var(--run); color: var(--run); }
.nmenu { position: fixed; z-index: 30; min-width: 200px; padding: 4px; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 6px 24px color-mix(in oklab, var(--ink) 22%, transparent); }
.nmenu [role=menuitem] { display: block; width: 100%; margin: 0; min-height: 34px; padding: 6px 10px; text-align: left; font-weight: 400; color: var(--ink); background: none; border: 0; border-radius: calc(var(--radius) * .5); }
.nmenu [role=menuitem]:hover { background: var(--none-bg); }
.nmenu [role=menuitem]:focus { background: var(--none-bg); outline: 2px solid var(--run); outline-offset: -2px; }
.nmenu [role=menuitem][aria-disabled="true"] { color: var(--muted); cursor: default; }
.print-btn { margin: 0; min-height: 0; padding: 2px 10px; font-size: 12px; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; }
.print-hint { font-size: 12px; color: var(--muted); }
.print-head { display: none; }
footer { margin-top: 36px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
footer a { color: inherit; }
@media (max-width: 520px) {
  .timeline li { grid-template-columns: auto 1fr; }
  .timeline li > :last-child { grid-column: 1 / -1; }
}
/* Export PDF (the browser's print): light theme, everything open, live-only controls hidden, nothing cut across pages where it fits. */
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #fff; font-size: 12px; }
  .wrap { max-width: none; padding: 0; }
  .top .tools, .pages, .tl-tools, .nav-tools, .nav-help, .nmenu, .tips, .tip, .map-hint, form, button, .retry, .themes, .print-hint, a.back, .toc { display: none !important; }
  .top { padding-bottom: 6px; }
  .print-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin: 0 0 8px; font-size: 11px; color: var(--muted); }
  details::details-content { content-visibility: visible !important; display: block !important; }
  details > summary { list-style: none; }
  pre, .scroll, .map-scroll, .map-scroll.mind { max-height: none !important; overflow: visible !important; }
  .map-scroll { border: 0; background: none; }
  .mapbox { max-height: none !important; overflow: visible !important; border: 0 !important; }
  svg.graph { display: block; max-width: 100%; width: auto; height: auto; max-height: 190mm; break-inside: avoid; }
  svg.map { max-width: 100%; width: auto; height: auto; max-height: 190mm; }
  svg.map .hl { opacity: 1 !important; visibility: visible !important; }
  .card, .round, .evidence, .q, .opt, tr, li, .map-scroll, svg.map, .goal, .needs, .next, .stat, .tip, .nav-panel, details, .map-legend, .map-say, img, pre, dl { break-inside: avoid; }
  h1, h2, h3, h4, summary, header.run { break-after: avoid; }
  h2 + *, h3 + * { break-before: avoid; }
  section.maps > p:has(~ .map-scroll) { break-after: avoid; }
  section.maps { break-before: auto; }
  a { color: inherit; text-decoration: none; }
  footer { margin-top: 16px; break-before: avoid; }
  p, li { orphans: 3; widows: 3; }
}
</style>
</head>

<div class="wrap">
{{top}}
<main id="app">{{body}}</main>
{{footer}}
</div>
{{script}}
